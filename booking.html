        <!--Bootstrap CSS Link-->

    <!--classes on body set to work with mt-auto so that the

        <!--Navigation-->
        <nav id = "navbar" class="navbar navbar-expand-lg" data-bs-theme="dark">
            <div class="container">
                <a class="navbar-brand" href="index.html">
                    <img src="assets/images/logo-sm-white.png" alt="Boardwalk Games Logo" class="logo">
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">

                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">

                        </li>
                    </ul>

            </div>
        </nav>

    
    
    <!--Footer / contact section-->
    <!--auto margin class to push the footer to the bottom-->
    <footer id="contact" class="mt-auto"> 
        <div class="container section">
            <div class="row justify-content-center">
                <div class="col-12 text-center">
                    <h2 class="display-6">Contact Us</h2>
                </div>
                <!--Contact info-->
                <div class="col-12 col-md-6 col-xl-4">
                    <h3 class="sub-heading-color">Contact info</h3>
                    <address>
                        <i class="fa-solid fa-location-dot"></i><strong>Boardwalk Games</strong><br>
                        123 Boardwalk,<br>
                        Boardwalk City, 12345 
                    </address>
                    <p>
                        <i class="fa-solid fa-phone"></i>012 345 6789<br>
                        <i class="fa-regular fa-paper-plane"></i>info@boardwalk-games.co
                    </p>
                    <div class="social-links my-4"><!--Social-link icons-->
                        <a href="https://www.instagram.com" target="_blank" 
                        aria-label="Visit our Instagram page (opens in a new tab)" rel="noopener">
                            <i class="fa-brands fa-instagram"></i>
                        </a>
                        <a href="https://www.facebook.com" target="_blank" 
                        aria-label="Visit our facebook page (opens in a new tab)" rel="noopener">
                            <i class="fa-brands fa-square-facebook"></i>
                        </a>
                        <a href="https://x.com" target="_blank" 
                        aria-label="Visit our X feed (opens in a new tab)" rel="noopener">
                            <i class="fa-brands fa-x-twitter"></i>
                        </a>
                    </div>
                </div>
                <!--Opening Times-->
                <div class="col-12 col-md-6 col-xl-4">
                    <h3 class="sub-heading-color">Opening Times</h3>
                    <table class="table table-dark">
                        <thead>
                            <tr>
                                <th scope="col">Day</th>
                                <th scope="col">Open</th>
                                <th scope="col">Close</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <th scope="row">Mon</th>
                                <td colspan="2">Closed</td>
                            </tr>
                            <tr>
                                <th scope="row">Tues-Thurs</th>
                                <td>11am</td>
                                <td>11pm</td>
                            </tr>
                            <tr>
                                <th scope="row">Fri-Sat</th>
                                <td>11am</td>
                                <td>12am</td>
                            </tr>
                            <tr>
                                <th scope="row">Sun</th>
                                <td>12pm</td>
                                <td>7pm</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </footer>
